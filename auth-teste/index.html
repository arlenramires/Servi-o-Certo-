<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serviço Certo — Acesso de teste</title>
<style>body{font:16px system-ui;background:#edf4fc;margin:0;padding:24px;color:#17304b}main{max-width:430px;margin:5vh auto;padding:26px;background:#fff;border-radius:16px;box-shadow:0 8px 28px #1233}h1{color:#0757b3}label{display:block;margin:14px 0 5px}input,select,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #b7c9d9;font:inherit}button{margin-top:18px;background:#0757b3;color:#fff;border:0}button:disabled{opacity:.5}small{color:#596e81}#status{white-space:pre-wrap}</style></head>
<body><main><h1>Serviço Certo</h1><small>Versão de teste. O aplicativo publicado não foi alterado.</small>
<section id="form"><label for="action">Ação</label><select id="action"><option value="login">Entrar</option><option value="signup">Criar conta</option><option value="reset">Recuperar senha</option></select>
<div id="registration" hidden><label for="name">Nome completo</label><input id="name" autocomplete="name"><label for="role">Perfil solicitado</label><select id="role"><option value="cliente">Cliente</option><option value="prestador">Prestador</option></select></div>
<label for="email">E-mail</label><input id="email" type="email" autocomplete="email"><div id="passwordArea"><label for="password">Senha (mínimo 8 caracteres)</label><input id="password" type="password" minlength="8"></div><button id="submit">Continuar</button></section>
<section id="logged" hidden><h2>Conta conectada</h2><p id="identity"></p><p id="profile"></p><button id="logout">Sair</button></section><section id="newPasswordArea" hidden><h2>Definir nova senha</h2><label for="newPassword">Nova senha (mínimo 8 caracteres)</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password"><button id="savePassword">Salvar nova senha</button></section><p id="status" role="status" aria-live="polite"></p></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from './supabase-config.js';
const el=id=>document.getElementById(id);
const configured=SUPABASE_PUBLISHABLE_KEY&&!SUPABASE_PUBLISHABLE_KEY.includes('PREENCHER');
const supabase=configured?createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const message=s=>el('status').textContent=s;
let recoveryMode=false;
function setRecoveryMode(enabled){recoveryMode=enabled;el('form').hidden=enabled;el('logged').hidden=true;el('newPasswordArea').hidden=!enabled;if(enabled)message('Digite uma nova senha para concluir a recuperação.');}
function safeError(error){const code=error?.code||'';if(code==='invalid_credentials')return 'E-mail ou senha incorretos.';if(code==='email_not_confirmed')return 'Confirme seu e-mail antes de entrar.';if(code==='over_email_send_rate_limit')return 'Muitas tentativas. Aguarde antes de solicitar outro e-mail.';return error?.message||'Não foi possível concluir a operação.';}
el('action').onchange=()=>{const a=el('action').value;el('registration').hidden=a!=='signup';el('passwordArea').hidden=a==='reset'};
async function render(user){if(recoveryMode)return;el('form').hidden=!!user;el('logged').hidden=!user;if(!user)return;el('identity').textContent=user.email||'';const {data,error}=await supabase.from('profiles').select('role,full_name').eq('id',user.id).maybeSingle();el('profile').textContent=error?'Não foi possível consultar o perfil.':data?'Perfil: '+data.role:'Perfil não provisionado no servidor.'}
el('submit').onclick=async()=>{if(!supabase)return message('Integração pendente: configurar a chave pública do Supabase.');const action=el('action').value,email=el('email').value.trim(),password=el('password').value;if(!email)return message('Informe o e-mail.');if(action!=='reset'&&password.length<8)return message('Senha deve ter pelo menos 8 caracteres.');el('submit').disabled=true;try{let response;if(action==='signup'){const full_name=el('name').value.trim();if(!full_name)throw Error('Informe seu nome.');response=await supabase.auth.signUp({email,password,options:{data:{full_name,requested_role:el('role').value}}});if(response.error)throw response.error;message('Cadastro solicitado. Confirme seu e-mail. O perfil depende de validação segura no banco.');if(response.data.session)await render(response.data.user)}else if(action==='reset'){response=await supabase.auth.resetPasswordForEmail(email);if(response.error)throw response.error;message('Se o e-mail existir, receberá instruções de recuperação.')}else{response=await supabase.auth.signInWithPassword({email,password});if(response.error)throw response.error;message('');await render(response.data.user)}}catch(error){message(safeError(error))}finally{el('submit').disabled=false}};
el('logout').onclick=async()=>{const {error}=await supabase.auth.signOut();if(error)return message(error.message);await render(null);message('Sessão encerrada.')};
el('savePassword').onclick=async()=>{if(!supabase)return message('Configuração do Supabase pendente.');const password=el('newPassword').value;if(password.length<8)return message('A nova senha deve ter pelo menos 8 caracteres.');el('savePassword').disabled=true;try{const {error}=await supabase.auth.updateUser({password});if(error)throw error;setRecoveryMode(false);message('Senha atualizada. Você pode acessar sua conta.');const {data}=await supabase.auth.getUser();await render(data.user)}catch(error){message(safeError(error))}finally{el('savePassword').disabled=false}};
if(supabase){supabase.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')setRecoveryMode(true);if(event==='SIGNED_OUT'){recoveryMode=false;el('newPasswordArea').hidden=true;render(null);}});const {data}=await supabase.auth.getUser();if(data.user)await render(data.user)}else message('Aguardando configuração e testes de segurança.');
</script></body></html>
